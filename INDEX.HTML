
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrendzBite Order Cart</title>
<style>
body{font-family:Arial;margin:0;background:#f4f7f2;color:#222}
header{background:#146b45;color:white;padding:22px;text-align:center}
main{max-width:900px;margin:auto;padding:15px}
section{background:white;padding:16px;margin:15px 0;border-radius:12px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.item{border:1px solid #ddd;padding:12px;border-radius:10px}
.price{color:#146b45;font-weight:bold}
button{cursor:pointer;border:0;border-radius:7px;padding:9px 13px;background:#146b45;color:white;font-size:16px}
.qty button{padding:5px 12px}
input,textarea{width:100%;box-sizing:border-box;padding:11px;margin:5px 0 12px;border:1px solid #bbb;border-radius:7px;font:inherit}
label{font-weight:bold}
.total{font-size:20px;font-weight:bold;color:#146b45}
#qr{width:210px;max-width:100%;display:block;margin:12px auto}
</style>
</head>
<body>
<header>
<h1>🍽️ TrendzBite</h1>
<p>Fresh Food • Home Delivery</p>
<p>Delivery Charge: ₹30</p>
</header>

<main>
<section>
<h2>Our Menu</h2>
<div class="menu" id="menu"></div>
</section>

<section>
<h2>🛒 Your Cart</h2>
<div id="cart">Your cart is empty.</div>
<p>Subtotal: ₹<span id="subtotal">0</span></p>
<p>Delivery: ₹<span id="delivery">0</span></p>
<p class="total">Grand Total: ₹<span id="total">0</span></p>
</section>

<section>
<h2>Delivery Details</h2>
<form id="orderForm">
<label>Customer Name *</label>
<input id="customer" required placeholder="Enter your name">

<label>Mobile Number *</label>
<input id="phone" type="tel" required placeholder="Mobile number">

<label>Delivery Address *</label>
<textarea id="address" required placeholder="Full address and landmark"></textarea>

<label>Payment Method</label>
<p><label><input style="width:auto" type="radio" name="payment" value="UPI QR" checked> UPI QR</label></p>
<p><label><input style="width:auto" type="radio" name="payment" value="Cash on Delivery"> Cash on Delivery</label></p>

<div id="qrArea">
<h3>Scan to Pay TrendzBite</h3>
<img id="qr" src="./qr.png" alt="TrendzBite UPI QR Code">
<p>UPI ID: 7889777704@ybl</p>
<p>Payment verify hone ke baad hi order paid confirm karein.</p>
</div>

<button type="submit">Send Order on WhatsApp</button>
</form>
</section>
</main>

<script>
const items=[
["Steamed Momos (1 plate)",100,"🥟"],
["Fried Momos (1 plate)",100,"🥟"],
["Fried Chicken Boneless (1 kg)",500,"🍗"],
["Fried Chicken Boneless (1/2 kg)",250,"🍗"],
["Crispy Fried Fish (1 kg)",500,"🐟"],
["Crispy Fried Fish (1/2 kg)",250,"🐟"],
["Roasted Chicken Seekh",50,"🍢"],
["Roasted Fish Seekh",50,"🍢"],
["Large Roasted Chicken Seekh",100,"🍢"],
["Large Roasted Fish Seekh",100,"🍢"],
["Irani Kheer",20,"🍮"]
];
let quantities=items.map(()=>0);
const rupees=n=>"₹"+n;
function drawMenu(){
 document.getElementById("menu").innerHTML=items.map((p,i)=>`
 <div class="item">
 <h3>${p[2]} ${p[0]}</h3>
 <p class="price">₹${p[1]}</p>
 <div class="qty">
 <button type="button" onclick="change(${i},-1)">−</button>
 <strong id="q${i}">${quantities[i]}</strong>
 <button type="button" onclick="change(${i},1)">+</button>
 </div></div>`).join("");
}
function change(i,n){
 quantities[i]=Math.max(0,quantities[i]+n);
 document.getElementById("q"+i).textContent=quantities[i];
 drawCart();
}
function drawCart(){
 let sub=0,lines=[];
 items.forEach((p,i)=>{
 if(quantities[i]>0){
 let amount=p[1]*quantities[i];sub+=amount;
 lines.push(`${p[0]} x ${quantities[i]} = ₹${amount}`);
 }
 });
 document.getElementById("cart").innerHTML=lines.length?lines.join("<br>"):"Your cart is empty.";
 document.getElementById("subtotal").textContent=sub;
 document.getElementById("delivery").textContent=sub?30:0;
 document.getElementById("total").textContent=sub?sub+30:0;
}
document.querySelectorAll('input[name="payment"]').forEach(el=>{
 el.addEventListener("change",()=>{
 document.getElementById("qrArea").style.display=
 document.querySelector('input[name="payment"]:checked').value==="UPI QR"?"block":"none";
 });
});
document.getElementById("orderForm").addEventListener("submit",e=>{
 e.preventDefault();
 let chosen=items.filter((p,i)=>quantities[i]>0);
 if(!chosen.length){alert("Please select food items first.");return;}
 let sub=items.reduce((s,p,i)=>s+p[1]*quantities[i],0);
 let payment=document.querySelector('input[name="payment"]:checked').value;
 let order=items.map((p,i)=>quantities[i]>0?`${p[0]} x ${quantities[i]} = ₹${p[1]*quantities[i]}`:"").filter(Boolean).join("\n");
 let message=`TRENDZBITE ORDER\nName: ${document.getElementById("customer").value}\nMobile: ${document.getElementById("phone").value}\nAddress: ${document.getElementById("address").value}\n\n${order}\n\nSubtotal: ₹${sub}\nDelivery: ₹${sub?30:0}\nTotal: ₹${sub?sub+30:0}\nPayment: ${payment}\nUPI ID: 7889777704@ybl`;
 window.open("https://wa.me/917889777704?text="+encodeURIComponent(message),"_blank");
});
drawMenu();drawCart();
</script>
</body>
</html>
